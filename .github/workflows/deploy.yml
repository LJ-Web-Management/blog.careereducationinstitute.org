name: Build and deploy blog

# The blog is published at /blog/ of the main site (https://cei.ictraining.us/blog/): the main site's own workflow
# checks out this repo and builds it into its dist/blog/. This workflow imports uploaded zips, checks the build,
# asks the main site to redeploy, and keeps this repo's old github.io address redirecting to the new one.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # lets the workflow commit newly published blog posts
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Publish blog posts from uploaded zip files
        run: node scripts/import-blog.mjs

      - name: Save published posts to the repository
        run: |
          if [ -n "$(git status --porcelain -- src/content/blog blog-uploads)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A -- src/content/blog blog-uploads
            git commit -m "Publish blog post(s) from uploaded zip [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      # BLOG_URL (optional repository variable) is the blog's address; it defaults to https://cei.ictraining.us/blog.
      - name: Build blog
        run: node scripts/build.mjs
        env:
          SITE_URL: ${{ vars.BLOG_URL || 'https://cei.ictraining.us/blog' }}
          MAIN_SITE_URL: ${{ vars.MAIN_SITE_URL }}   # optional repository variable; empty means the address the blog sits under

      - name: SEO audit
        run: node scripts/audit.mjs
        env:
          SITE_URL: ${{ vars.BLOG_URL || 'https://cei.ictraining.us/blog' }}
          MAIN_SITE_URL: ${{ vars.MAIN_SITE_URL }}

      # This repo's own Pages site (the old github.io address) only redirects to the blog's real address.
      - name: Redirect pages for the old address
        run: node scripts/redirects.mjs
        env:
          SITE_URL: ${{ vars.BLOG_URL || 'https://cei.ictraining.us/blog' }}
          MAIN_SITE_URL: ${{ vars.MAIN_SITE_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-redirects

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Publish: the main site's deploy builds this blog into cei.ictraining.us/blog/. Needs the secret
      # SITE_DISPATCH_TOKEN (a fine-grained token with Contents: read and write on the main site's repo). Without it,
      # new posts go live on the main site's next deploy (it also redeploys on a schedule).
      # MAIN_SITE_REPO (optional variable) defaults to LJ-Web-Management/www.careereducationinstitute.org.
      - name: Tell the main site to rebuild (publishes the blog)
        if: ${{ github.event_name != 'repository_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          REPO: ${{ vars.MAIN_SITE_REPO || 'LJ-Web-Management/www.careereducationinstitute.org' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::SITE_DISPATCH_TOKEN is not set, so the main site was not asked to redeploy. New posts appear at /blog/ on its next deploy."
            exit 0
          fi
          gh api "repos/$REPO/dispatches" -f event_type=blog-updated
